[package]
name = "lifeos-desktop"
version = "0.1.0"
description = "Lokale Mac-App für Anton Life OS"
authors = ["Anton"]
edition = "2021"

[lib]
name = "lifeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
